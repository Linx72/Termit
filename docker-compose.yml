services:
  termit:
    build: .
    expose:
      - "8765"
    env_file:
      - .env
    environment:
      # SQLite volumes — не монтировать на /app (перекрывает код из image).
      TERMIT_MEMORY_SQLITE_PATH: /app/persist/termit_memory.db
      TERMIT_QUOTA_SQLITE_PATH: /app/persist/termit_quota.db
      TERMIT_TASK_SQLITE_PATH: /app/persist/termit_tasks.db
      TERMIT_AGENT_RUN_SQLITE_PATH: /app/persist/termit_agent_runs.db
      TERMIT_AGENT_MEMORY_SQLITE_PATH: /app/persist/termit_agent_memory.db
      TERMIT_RESPONSE_CACHE_SQLITE_PATH: /app/persist/termit_response_cache.db
    volumes:
      - ./data:/app/data
      - termit-sqlite:/app/persist
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2-alpine
    depends_on:
      - termit
    ports:
      - "8080:8080"
      - "443:443"
      - "80:80"
    environment:
      DOMAIN: ${TERMIT_PUBLIC_DOMAIN:-localhost}
      ACME_EMAIL: ${TERMIT_ACME_EMAIL:-ops@example.com}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

  # Optional: Ollama on the same host
  # ollama:
  #   image: ollama/ollama:latest
  #   expose:
  #     - "11434"
  #   volumes:
  #     - ollama-data:/root/.ollama

  # Optional: self-hosted web search for Termit web_search tool (no API key)
  searxng:
    image: searxng/searxng:latest
    ports:
      - "8888:8080"
    volumes:
      - ./deploy/searxng:/etc/searxng:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  termit-sqlite:
  caddy-data:
  caddy-config:
  # ollama-data:
