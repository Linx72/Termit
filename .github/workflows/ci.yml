name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run platform e2e tests
        run: python -m unittest tests.test_platform_e2e -v

      - name: Finetune pipeline tests
        run: python -m unittest tests.test_finetune_dpo_export tests.test_finetune_pipeline_e2e -v

      - name: Smoke HTTP against live server
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8765 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8765/health && break
            sleep 1
          done
          ./scripts/smoke_http.sh

      - name: Eval suite CI gate
        env:
          TERMIT_EVAL_MIN_PASS_RATE: "0.95"
          TERMIT_EVAL_CI_LIMIT: "53"
        run: |
          curl -sf -X POST http://127.0.0.1:8765/api/eval/run-suite \
            -H 'Content-Type: application/json' \
            -d '{"limit":53,"persist_report":false}' \
            | python3 scripts/eval_ci_gate.py
