name: Weekly Do-All Plan

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

jobs:
  do-all-plan:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Bootstrap Ollama (optional)
        run: |
          if [[ -f scripts/bootstrap_ollama_ci.sh ]]; then
            TERMIT_SKIP_OLLAMA_CHECK=1 ./scripts/bootstrap_ollama_ci.sh || true
          fi

      - name: Start Termit API
        env:
          TERMIT_ORCH_TOOL_LOOP_EXECUTION_ENABLED: "true"
          TERMIT_ORCH_EVAL_FIXTURE_CODER: "true"
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8765 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8765/health && break
            sleep 2
          done

      - name: Do-all plan (phase 5)
        env:
          TERMIT_FINETUNE_AUTO_TRAIN: "true"
          TERMIT_FINETUNE_KPI_STRICT: "false"
          TERMIT_PLAN_TRY_STRICT_LIVE: "false"
          TERMIT_DO_ALL_TRY_CLOUD: ${{ secrets.OPENAI_COMPAT_API_KEY != '' && 'true' || 'false' }}
          OPENAI_COMPAT_API_KEY: ${{ secrets.OPENAI_COMPAT_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: ./scripts/do_all_plan.sh

      - name: Upload plan status artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plan-status
          path: |
            /tmp/termit_plan_status_after.json
            data/plan_status_last.json
          if-no-files-found: ignore
