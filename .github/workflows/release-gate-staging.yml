name: Release Gate Staging

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 0"

jobs:
  staging-gate:
    # ubuntu: встроенный Docker; macOS GH runners не поднимают Colima/VZ.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TERMIT_HOSTED_BASE_URL: http://127.0.0.1:8080
      # docker.env.example: auth on; eval/* требует operator (rbac.py)
      TERMIT_API_KEY: operator-key
      TERMIT_HOSTED_AUTH_EXPECT: "true"
      TERMIT_BETA_STAGING_STRICT: "false"
      TERMIT_BETA_REQUIRE_PRODUCT_GATES: "false"
      TERMIT_PROD_READINESS_CI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Deploy hosted beta
        run: ./scripts/deploy_hosted_beta.sh

      - name: Prod readiness (plan + preflight + staging gate)
        env:
          TERMIT_PROD_READINESS_STAGING: "true"
          TERMIT_PROD_READINESS_STRICT_GPU: "false"
        run: ./scripts/prod_readiness_check.sh

      - name: Upload staging artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-staging
          path: |
            data/beta_staging_gate_last.json
            data/plan_status_staging.json
          if-no-files-found: ignore
