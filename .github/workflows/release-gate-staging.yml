name: Release Gate Staging

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 0"

jobs:
  staging-gate:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Colima and Docker CLI
        run: |
          if ! command -v docker >/dev/null 2>&1; then
            brew install colima docker
          fi

      - name: Start Colima
        run: |
          if command -v colima >/dev/null 2>&1; then
            colima start --cpu 2 --memory 4 || true
          fi

      - name: Deploy hosted beta
        run: ./scripts/start_colima_and_deploy_beta.sh

      - name: Prod readiness (plan + preflight + staging gate)
        run: |
          TERMIT_PROD_READINESS_STAGING=true \
          TERMIT_PROD_READINESS_STRICT_GPU=false \
            ./scripts/prod_readiness_check.sh

      - name: Upload staging artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-staging
          path: |
            data/beta_staging_gate_last.json
            data/plan_status_staging.json
          if-no-files-found: ignore
