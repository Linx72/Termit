name: Nightly Extended Smoke

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

jobs:
  nightly-extended-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run extended smoke with live server
        env:
          TERMIT_SMOKE_REQUIRE_SERVER: "1"
          TERMIT_EVAL_MIN_PASS_RATE: "0.95"
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8765 &
          for i in $(seq 1 45); do
            curl -sf http://127.0.0.1:8765/health && break
            sleep 1
          done
          ./scripts/release_smoke_extended.sh
