name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    env:
      TERMIT_CODESIGN_IDENTITY: ${{ secrets.TERMIT_CODESIGN_IDENTITY }}
      TERMIT_NOTARY_PROFILE: ${{ secrets.TERMIT_NOTARY_PROFILE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Resolve release version
        run: echo "TERMIT_RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
      - name: Run unit tests
        run: .venv/bin/python -m unittest discover -s tests -v
      - name: Build Termit desktop app bundle
        run: ./scripts/package_desktop.sh
      - name: Verify codesign (signed release)
        if: env.TERMIT_CODESIGN_IDENTITY != ''
        run: ./scripts/verify_desktop_signature.sh clients/termit-shell/release/TermitShell.app
      - name: Post-build launch smoke (bundle)
        run: |
          test -d clients/termit-shell/release/TermitShell.app
          open -a clients/termit-shell/release/TermitShell.app || open clients/termit-shell/release/TermitShell.app
          sleep 2
          pgrep -f "TermitShell.app/Contents/MacOS/termit-shell" >/dev/null
          pkill -f "TermitShell.app/Contents/MacOS/termit-shell" || true
      - name: Create distributable archive and checksum
        run: |
          APP_ZIP="clients/termit-shell/release/Termit-${TERMIT_RELEASE_VERSION}-macos.zip"
          ditto -c -k --sequesterRsrc --keepParent \
            clients/termit-shell/release/TermitShell.app \
            "$APP_ZIP"
          shasum -a 256 "$APP_ZIP" | tee "${APP_ZIP}.sha256"
          # Legacy alias for scripts/docs that expect TermitShell.app.zip
          cp "$APP_ZIP" clients/termit-shell/release/TermitShell.app.zip
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            clients/termit-shell/release/Termit-*-macos.zip
            clients/termit-shell/release/Termit-*-macos.zip.sha256
            clients/termit-shell/release/TermitShell.app.zip
