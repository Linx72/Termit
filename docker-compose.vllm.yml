# vLLM sidecar overlay (ось A) — быстрый coding inference для Termit
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.vllm.yml --profile vllm up -d
#
# В .env для termit (на том же docker network):
#   TERMIT_VLLM_ENABLED=true
#   TERMIT_VLLM_BASE_URL=http://vllm:8000
#   TERMIT_CODE_MODEL=vllm:Qwen/Qwen3-Coder-Next

services:
  vllm:
    profiles: ["vllm"]
    image: ${TERMIT_VLLM_IMAGE:-vllm/vllm-openai:latest}
    container_name: ${TERMIT_VLLM_CONTAINER:-termit-vllm}
    command:
      - --model
      - ${TERMIT_VLLM_SERVED_MODEL:-Qwen/Qwen3-Coder-Next}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --dtype
      - auto
      - --max-model-len
      - "32768"
      - --enable-auto-tool-choice
      - --tool-call-parser
      - hermes
    expose:
      - "8000"
    ports:
      - "${TERMIT_VLLM_PORT:-8000}:8000"
    volumes:
      - vllm-hf-cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8000/v1/models"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    restart: unless-stopped

volumes:
  vllm-hf-cache:
